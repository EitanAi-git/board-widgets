<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Board widgets</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#121214">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root{--bg:#121214;--card:#1c1c1e;--raise:#2c2c2e;--line:#3a3a3e;--text:#f2f2f2;--dim:#a0a0a6;--accent:#D97757}
  html,body{margin:0;min-height:100%}
  html,*{-webkit-tap-highlight-color:rgba(0,0,0,0)!important}
  :focus:not(:focus-visible){outline:none}
  body{background:var(--bg);background-image:radial-gradient(#2a2a2e 1.2px,transparent 1.2px);background-size:24px 24px;font-family:system-ui,sans-serif;color:var(--text);overflow-x:hidden}
  #wrap{position:relative;margin:0 auto;transform-origin:top left}
  .card{position:absolute;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px var(--raise),0 4px 14px rgba(0,0,0,.5);background:var(--card);cursor:pointer;transition:transform .15s,box-shadow .15s}
  .card:hover{box-shadow:0 0 0 2px var(--accent),0 6px 18px rgba(0,0,0,.6)}
  .card:active{transform:scale(.97)}
  .sec{position:absolute;font-size:28px;font-weight:800;color:#f2f2f2;letter-spacing:-.01em}
  .card iframe{display:block;width:100%;height:100%;border:0;pointer-events:none}

  /* Details sheet */
  #shade{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:560px;margin:0 auto;height:94vh;height:94dvh;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.5);transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
  body.open #shade{opacity:1;pointer-events:auto}
  body.open #sheet{transform:none}
  body.open{overflow:hidden}
  #grab{padding:10px 0 4px;display:flex;justify-content:center;cursor:grab;touch-action:none}
  #grab i{width:44px;height:5px;border-radius:3px;background:var(--line)}
  #close{position:absolute;top:12px;right:14px;width:40px;height:40px;border-radius:50%;border:0;background:var(--raise);color:var(--text);font-size:18px;cursor:pointer;z-index:2}
  #scroll{overflow-y:auto;flex:1;padding:0 18px calc(24px + env(safe-area-inset-bottom))}
  #hero{margin:8px 0 16px;border-radius:18px;overflow:hidden;background:#1c1c1e;box-shadow:0 0 0 1px var(--raise);width:100%;max-height:52vh;max-height:52dvh}
  #hero iframe{width:100%;height:100%;border:0;display:block}
  .head{display:flex;gap:14px;align-items:center;margin-bottom:12px}
  .ico{width:56px;height:56px;border-radius:14px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
  h2{margin:0;font-size:24px}
  .tag{display:inline-block;margin-top:4px;font-size:12px;font-weight:600;color:var(--accent);background:rgba(217,119,87,.14);padding:3px 9px;border-radius:999px}
  .desc{color:var(--dim);font-size:15px;line-height:1.5;margin:0 0 16px}
  .actions{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:22px}
  .btn{font:600 16px system-ui,sans-serif;padding:14px 10px;border-radius:14px;border:1px solid var(--line);background:var(--raise);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
  .btn.main{background:var(--accent);border:0;color:#fff;font-size:17px}
  .btn:active{transform:scale(.97)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
  .stat{background:var(--raise);border-radius:14px;padding:12px;text-align:center}
  .stat b{display:block;font-size:17px}
  .stat span{font-size:12px;color:var(--dim)}
  h3{font-size:17px;margin:0 0 10px}
  .tips{margin:0 0 22px;padding:0;list-style:none}
  .tips li{background:var(--raise);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:15px;line-height:1.4;display:flex;gap:10px}
  .tips li::before{content:"✦";color:var(--accent)}
  .more{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .mini{flex:none;width:120px;cursor:pointer}
  .mini .ico{width:120px;height:90px;border-radius:16px;font-size:38px;background:var(--raise)}
  .mini div:last-child{font-size:13px;margin-top:6px;color:var(--dim)}
  #stage{overflow:hidden}
  #ver{text-align:center;font-size:10px;color:#55555a;padding:6px 0 calc(8px + env(safe-area-inset-bottom));letter-spacing:.04em}
  .sets{background:var(--raise);border-radius:14px;margin-bottom:22px;overflow:hidden}
  .set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--card)}
  .set:last-child{border-bottom:0}
  .set label{font-size:15px}
  .set select,.set input{font:16px system-ui,sans-serif;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:55%}
  .set input[type=text]{width:55%}
  .set input[type=number]{width:80px}
  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#f2f2f2;color:#111;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.2s;z-index:20;pointer-events:none}
  #toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="stage"><div id="wrap"></div></div>
<div id="ver"></div>

<div id="shade"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="t">
  <div id="grab"><i></i></div>
  <button id="close" type="button" aria-label="Close">✕</button>
  <div id="scroll">
    <div id="hero"><iframe id="ff" title="" allow="microphone; autoplay"></iframe></div>
    <div class="head"><div class="ico" id="ic"></div><div><h2 id="t"></h2><span class="tag" id="cat"></span></div></div>
    <p class="desc" id="desc"></p>
    <div class="actions">
      <button class="btn main" id="solo" type="button">▶ Open alone</button>
      <button class="btn" id="share" type="button">↗ Share</button>
      <button class="btn" id="reset" type="button">↺ Reset</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="s1"></b><span>Remembers</span></div>
      <div class="stat"><b id="s2"></b><span>Works offline</span></div>
      <div class="stat"><b id="s3"></b><span>Players</span></div>
    </div>
    <div id="setwrap"><h3>Settings</h3><div class="sets" id="sets"></div></div>
    <h3>How to use</h3>
    <ul class="tips" id="tips"></ul>
    <h3>More like this</h3>
    <div class="more" id="more"></div>
  </div>
</div>
<div id="toast"></div>

<script>
// slug, name, board x, y, w, h, category, emoji, players, remembers progress, description, tips, settings
// settings: [key, label, type (select|text|number), default, options]
var W=[
  ["counter","Counter",-340,-340,340,340,"Time","🔢","Any",1,"A big tap counter with a real button click. Count laps, reps, people at the door or points in a game.",["Tap + and − to count up or down.","Reset sets it back to 0.","Turn the sound off for quiet rooms."],[["step","Step size","select",1,[1,2,5,10]]]],
  ["scoreboard","Scoreboard",40,-340,330,340,"Group","🏆","2–5 teams",1,"Keep score for up to five teams. Rename each team and tap to add or take away points.",["Tap a team name to rename it.","+ Team adds up to five teams.","Reset zeroes every score but keeps the names."]],
  ["poll","Quick poll",420,-340,330,340,"Group","📊","Any",1,"Ask a question and let people tap to vote. Bars show how the votes split.",["Tap the question to change it.","Tap an option to vote for it.","Reset votes clears the counts."],[["options","Options, separated by commas","text","","Option A, Option B, Option C"]]],
  ["timer","Timer",-340,40,340,340,"Time","⏲️","Any",0,"A simple countdown with an alarm. Pick 1, 5, 10 or 25 minutes, or type your own.",["Tap a preset or type minutes.","Pause keeps the time left.","The alarm sound is in Settings."],[["alarm","Alarm sound","select","beep",["beep","bell","click","none"]]]],
  ["stopwatch","Stopwatch",40,40,320,300,"Time","⏱️","Any",0,"Time anything to a tenth of a second, with laps.",["Start and Stop on the same button.","Lap saves the last four times.","Reset clears time and laps."]],
  ["dice","Dice roller",420,40,320,300,"Random","🎲","Any",0,"Roll a D6, D12, D20 or D100 for board games and role-playing.",["Tap a die to roll it.","Your last four rolls show underneath."]],
  ["notes","Shared notes",-340,420,320,300,"Group","📝","Any",1,"A scratch pad that saves as you type.",["Just start typing; it saves itself.","Add date stamps today's date on a new line.","Clear empties the page."]],
  ["todo","Shared to-do list",40,420,340,340,"Group","✅","Any",1,"A checklist for chores, shopping or plans.",["Type a task and tap Add.","Tick it when done.","x removes a task."]],
  ["random-picker","Random picker",420,420,340,320,"Random","🎯","Any",0,"Pick one name or option at random, or shuffle the whole list.",["Put one option per line.","Pick one chooses a winner.","Shuffle all mixes the order."]],
  ["spinning-wheel","Spinning wheel",-340,800,340,340,"Random","🎡","Any",1,"Spin a colourful wheel to decide. Up to 12 options.",["Type options separated by commas.","Tap Spin and wait for the arrow.","The last result is kept."]],
  ["coin-flip","Coin flip",40,800,340,340,"Random","🪙","1–2",1,"Heads or tails, with a running count of each.",["Tap Flip.","The totals keep adding up.","Reset clears the totals."]],
  ["team-shuffler","Team shuffler",420,800,340,340,"Group","🔀","Any",1,"Split a list of names into fair random teams.",["Type names separated by commas.","Choose 2 to 6 teams.","Tap Shuffle to deal them out."]],
  ["pomodoro","Pomodoro",-340,1180,340,340,"Time","🍅","1",1,"Focus, then take a short break. Lengths are in Settings.",["Start runs the current mode.","Switch flips between Focus and Break.","It keeps counting even if you close it."],[["focus","Focus minutes","select",25,[15,20,25,30,45,50,60]],["brk","Break minutes","select",5,[3,5,10,15]]]],
  ["rock-paper-scissors","Rock paper scissors",40,1180,340,340,"Games","✊","1 vs phone",1,"Play against the phone and keep a tally of wins, losses and ties.",["Tap your move.","The phone picks at the same moment.","Reset starts a new tally."]],
  ["mood-check-in","Mood check-in",420,1180,340,340,"Group","🙂","Any",1,"Everyone taps how they feel; the bars show the room's mood.",["Tap the mood that fits.","Pass the phone around for a group.","Reset starts a new check-in."]],
  ["chess-clock","Chess clock",-340,1560,340,340,"Games","♟️","2",1,"Two clocks, one per player. Tap your half after your move to start your opponent's clock.",["Put the phone between you; the top half faces the other player.","Only the player whose clock is running can tap.","Time per player and seconds added per move are in Settings."],[["minutes","Minutes each","select",5,[1,3,5,10,15,30,60]],["increment","Seconds added per move","select",0,[0,1,2,3,5,10]]]],
  ["tally","Tally for two",40,1560,340,340,"Games","🆚","2",1,"A split-screen counter for two players. Each person taps their own half.",["Tap your half to add a point.","− takes one back.","Tap a name to rename the player."]],
  ["reaction","Reaction test",420,1560,340,340,"Games","⚡","Any",1,"Wait for green, then tap as fast as you can. Compare times with friends.",["Tap to start, then wait for green.","Tapping on red counts as too soon.","Your best and the average of your last 5 are saved."]],
  ["metronome","Metronome",-340,1940,340,340,"Time","🥁","Any",1,"A steady click from 30 to 240 BPM, using the same button sound as the counter.",["Use − / + or the slider to set the tempo.","Tap tempo: tap along a few times to match a song.","Beats per bar and the accent are in Settings."],[["beats","Beats per bar","select",4,[2,3,4,5,6,7]],["accent","Accent the first beat","select","yes",["yes","no"]]]],
  ["habit","Habit tracker",40,1940,340,340,"Tools","💧","1",1,"Set a daily goal and build a streak. Starts as a water tracker; rename it to anything.",["Tap +1 each time you do it.","Hit the goal each day to grow your streak.","The bars show the last 7 days."],[["name","Habit name","text","Water"],["unit","Unit","text","glasses"],["goal","Daily goal","number",8]]],
  ["decibel","Decibel meter",420,1940,340,340,"Tools","🔊","Any",0,"Shows roughly how loud the room is, using the microphone.",["Tap Start and allow the microphone.","Watch the average and the peak.","Readings are approximate; phone mics aren't calibrated."]],
  ["spinner","Fidget spinner",-340,2400,340,340,"Fidget","🌀","1",1,"Flick it and watch it go. It clicks on every notch, faster as it speeds up.",["Drag around the middle and let go to fling it.","A quick tap gives it a push.","Notches per turn and how long it spins are in Settings."],[["ticks","Clicks per turn","select",12,[6,12,24]],["spin","Spin length","select","long",["long","medium","short"]]]],
  ["key-clicker","Key clicker",40,2400,340,340,"Fidget","⌨️","1",1,"One mechanical keyboard key to press as much as you like, with a press and a release sound.",["Press and hold to hear the two halves of the click.","Try the three switch types in Settings.","Space or Enter press it too."],[["sw","Switch type","select","clicky",["clicky","tactile","linear"]],["label","Key label","text","Esc"]]],
  ["light-switch","Light switch",420,2400,340,340,"Fidget","💡","1",1,"A satisfying wall switch. It lights the bulb in this tile only; the app stays dark.",["Tap the switch to flip it.","Pick the bulb colour in Settings."],[["color","Bulb colour","select","warm",["warm","white","pink","green","blue"]]]]
];

// Board
var LABELS=[["Fidget",-340,2340]];   // section headings on the board
var PAD=40,minX=-340,minY=-340,maxX=0,maxY=0;
W.forEach(function(w){maxX=Math.max(maxX,w[2]+w[4]);maxY=Math.max(maxY,w[3]+w[5])});
var BW=maxX-minX+PAD*2,BH=maxY-minY+PAD*2;
var wrap=document.getElementById("wrap"),previews={};
wrap.style.width=BW+"px";wrap.style.height=BH+"px";
W.forEach(function(w){
  var c=document.createElement("div");c.className="card";c.setAttribute("role","button");c.setAttribute("aria-label","Open "+w[1]);
  c.style.left=(w[2]-minX+PAD)+"px";c.style.top=(w[3]-minY+PAD)+"px";c.style.width=w[4]+"px";c.style.height=w[5]+"px";
  var f=document.createElement("iframe");f.src=url(w);f.title=w[1];f.tabIndex=-1;previews[w[0]]=f;
  c.appendChild(f);c.onclick=function(){openSheet(w,true)};wrap.appendChild(c);
});
LABELS.forEach(function(l){var h=document.createElement("div");h.className="sec";h.textContent=l[0];h.style.left=(l[1]-minX+PAD)+"px";h.style.top=(l[2]-minY+PAD)+"px";wrap.appendChild(h)});
function url(w){return "widgets/"+w[0]+".html"}
function fit(){var s=Math.min(1,document.documentElement.clientWidth/BW);wrap.style.transform="scale("+s+")";wrap.style.marginLeft=s<1?"0":"auto";wrap.style.height=BH+"px";document.getElementById("stage").style.height=(BH*s)+"px"}
window.addEventListener("resize",fit);fit();

// Sheet
var $=function(id){return document.getElementById(id)},cur=null;
function openSheet(w,push){
  cur=w;
  $("hero").style.aspectRatio=w[4]+"/"+w[5];$("ff").src=url(w)+"?full=1&w="+w[4]+"&h="+w[5];$("ff").title=w[1];
  $("ic").textContent=w[7];$("t").textContent=w[1];$("cat").textContent=w[6];$("desc").textContent=w[10];
  $("s1").textContent=w[9]?"Yes":"No";$("s2").textContent="Yes";$("s3").textContent=w[8];
  $("reset").style.display=w[9]?"":"none";
  renderSettings(w);
  $("tips").textContent="";w[11].forEach(function(t){var li=document.createElement("li");var s=document.createElement("span");s.textContent=t;li.appendChild(s);$("tips").appendChild(li)});
  $("more").textContent="";
  W.filter(function(o){return o[6]===w[6]&&o!==w}).concat(W.filter(function(o){return o[6]!==w[6]})).slice(0,6).forEach(function(o){
    var m=document.createElement("div");m.className="mini";
    var i=document.createElement("div");i.className="ico";i.textContent=o[7];
    var n=document.createElement("div");n.textContent=o[1];
    m.append(i,n);m.onclick=function(){openSheet(o,false)};$("more").appendChild(m);
  });
  $("scroll").scrollTop=0;
  if(!document.body.classList.contains("open")){document.body.classList.add("open");if(push)history.pushState({sheet:1},"")}
}
function closeSheet(fromHistory){
  if(!document.body.classList.contains("open"))return;
  document.body.classList.remove("open");$("sheet").style.transform="";
  setTimeout(function(){if(!document.body.classList.contains("open"))$("ff").src="about:blank"},300);
  if(!fromHistory&&history.state&&history.state.sheet)history.back();
}
$("close").onclick=function(){closeSheet(false)};
$("shade").onclick=function(){closeSheet(false)};
window.addEventListener("popstate",function(){closeSheet(true)});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet(false)});

// Drag the handle down to close
(function(){var g=$("grab"),sh=$("sheet"),y0=null,dy=0;
  g.addEventListener("pointerdown",function(e){y0=e.clientY;dy=0;sh.style.transition="none";g.setPointerCapture(e.pointerId)});
  g.addEventListener("pointermove",function(e){if(y0===null)return;dy=Math.max(0,e.clientY-y0);sh.style.transform="translateY("+dy+"px)"});
  g.addEventListener("pointerup",function(){if(y0===null)return;y0=null;sh.style.transition="";if(dy>120)closeSheet(false);else sh.style.transform=""});
})();


// Settings: saved per widget; the widget picks changes up live
function skey(w){return "settings:"+new URL(url(w),location.href).pathname}
function getSet(w){try{return JSON.parse(localStorage.getItem(skey(w))||"{}")||{}}catch(e){return {}}}
function renderSettings(w){
  var box=$("sets");box.textContent="";var defs=w[12]||[];
  $("setwrap").style.display=defs.length?"":"none";
  var cur=getSet(w);
  defs.forEach(function(f){
    var row=document.createElement("div");row.className="set";
    var id="set-"+f[0],lab=document.createElement("label");lab.htmlFor=id;lab.textContent=f[1];
    var val=(f[0] in cur)?cur[f[0]]:f[3],el;
    if(f[2]==="select"){el=document.createElement("select");f[4].forEach(function(o){var op=document.createElement("option");op.value=o;op.textContent=o;el.appendChild(op)});el.value=val}
    else{el=document.createElement("input");el.type=f[2];el.value=val;if(f[4])el.placeholder=f[4];if(f[2]==="number")el.min=1}
    el.id=id;
    el.addEventListener("change",function(){
      var v=el.value;if(typeof f[3]==="number"){v=Number(v);if(!(v>0))v=f[3]}
      var s=getSet(w);s[f[0]]=v;try{localStorage.setItem(skey(w),JSON.stringify(s))}catch(e){}
      toast("Saved");
    });
    row.append(lab,el);box.appendChild(row);
  });
}

// Actions
function toast(t){var el=$("toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove("on")},1800)}
$("solo").onclick=function(){location.href=url(cur)};
$("share").onclick=function(){
  var link=new URL(url(cur),location.href).href;
  if(navigator.share)navigator.share({title:cur[1],url:link}).catch(function(){});
  else if(navigator.clipboard)navigator.clipboard.writeText(link).then(function(){toast("Link copied")});
};
$("reset").onclick=function(){
  if(!confirm("Clear everything saved in "+cur[1]+"?"))return;
  try{localStorage.removeItem("widget:"+new URL(url(cur),location.href).pathname)}catch(e){}
  $("ff").src=$("ff").src;previews[cur[0]].src=previews[cur[0]].src;toast(cur[1]+" reset");
};

// Version shown at the bottom comes from VERSION in sw.js
fetch("sw.js",{cache:"no-store"}).then(function(r){return r.text()}).then(function(t){var m=t.match(/VERSION = "([^"]+)"/);if(m)$("ver").textContent=m[1]}).catch(function(){});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js",{updateViaCache:"none"});
</script>
</body>
</html>
