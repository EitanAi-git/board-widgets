<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="../shim.js"></script>
<title>Random picker</title><style>body{box-sizing:border-box;height:100vh;overflow:auto}</style><div style="font-family:sans-serif;padding:16px;background:#1c1c1e;color:#f2f2f2;min-height:100%;box-sizing:border-box"><div style="margin-bottom:8px">One name or option per line</div><textarea id="o" style="width:100%;box-sizing:border-box;height:110px;font-size:15px;padding:10px;background:#2c2c2e;color:#f2f2f2;border:1px solid #555;border-radius:12px;resize:none">Alex
Sam
Jordan</textarea><div id="r" style="font-size:30px;font-weight:700;text-align:center;margin:14px 0;min-height:40px">?</div><div style="display:flex;gap:10px;justify-content:center"><button id="b" style="font-size:16px;padding:10px 16px;border-radius:12px;border:none;background:#D97757;color:#fff;cursor:pointer">Pick one</button><button id="s" style="font-size:16px;padding:10px 16px;border-radius:12px;border:1px solid #555;background:#2c2c2e;color:#f2f2f2;cursor:pointer">Shuffle all</button></div></div><script>document.body.style.margin="0";document.body.style.background="#1c1c1e";var o=document.getElementById('o'),r=document.getElementById('r');function L(){return o.value.split('\n').map(function(s){return s.trim()}).filter(Boolean)}document.getElementById('b').onclick=function(){var l=L();if(l.length)r.textContent=l[Math.floor(Math.random()*l.length)]};document.getElementById('s').onclick=function(){var l=L();for(var i=l.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=l[i];l[i]=l[j];l[j]=x}r.textContent=l.join(', ')};</script>
