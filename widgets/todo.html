<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,*{-webkit-tap-highlight-color:rgba(0,0,0,0)!important}:focus:not(:focus-visible){outline:none}</style><script src="../shim.js?v=16"></script>
<title>Shared to-do list</title><style>body{box-sizing:border-box;height:100vh;overflow:auto}</style><style>body{margin:0;background:#1c1c1e}.w{font-family:sans-serif;padding:16px;background:#1c1c1e;color:#f2f2f2;min-height:100%;box-sizing:border-box}li{list-style:none;padding:6px 0;font-size:15px}.d{text-decoration:line-through;color:#888}ul{padding:0;margin:12px 0}input[type=text]{width:66%;padding:8px;font-size:14px;border-radius:8px;border:1px solid #555;background:#2c2c2e;color:#f2f2f2}button{padding:8px 14px;border-radius:8px;border:1px solid #555;background:#2c2c2e;color:#f2f2f2;cursor:pointer}#a{border:none;background:#D97757;color:#fff}</style><div class="w"><div><input type="text" id="n" placeholder="Add a task"> <button id="a">Add</button></div><ul id="l"></ul></div><script>var items=[];var d=appifactEmbed.load();if(d&&d.items)items=d.items;function draw(){var l=document.getElementById('l');l.innerHTML='';items.forEach(function(it,i){var li=document.createElement('li');var c=document.createElement('input');c.type='checkbox';c.checked=it.done;c.onchange=function(){it.done=c.checked;appifactEmbed.save({items:items});draw()};var s=document.createElement('span');s.textContent=' '+it.text;if(it.done)s.className='d';var x=document.createElement('button');x.textContent='x';x.style.marginLeft='8px';x.onclick=function(){items.splice(i,1);appifactEmbed.save({items:items});draw()};li.appendChild(c);li.appendChild(s);li.appendChild(x);l.appendChild(li)})}document.getElementById('a').onclick=function(){var n=document.getElementById('n');if(!n.value.trim())return;items.push({text:n.value.trim(),done:false});n.value='';appifactEmbed.save({items:items});draw()};appifactEmbed.onLoad(function(x){if(x&&x.items){items=x.items;draw()}});draw();</script>
