<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="../shim.js"></script>
<title>Shared notes</title><style>body{box-sizing:border-box;height:100vh;overflow:auto}</style><style>body{margin:0;background:#1c1c1e}.w{font-family:sans-serif;padding:16px;background:#1c1c1e;color:#f2f2f2;min-height:100%;box-sizing:border-box}textarea{width:100%;box-sizing:border-box;height:170px;font-size:15px;padding:10px;background:#2c2c2e;color:#f2f2f2;border:1px solid #555;border-radius:12px;resize:none}button{font-size:16px;padding:8px 16px;margin:12px 10px 0 0;border-radius:8px;border:1px solid #555;background:#2c2c2e;color:#f2f2f2;cursor:pointer}#d{border:none;background:#D97757;color:#fff}</style><div class="w"><div style="margin-bottom:8px">Notes everyone can edit</div><textarea id="x" placeholder="Type here..."></textarea><button id="c">Clear</button><button id="d">Add date</button></div><script>var x=document.getElementById('x');var d=appifactEmbed.load();if(d&&d.text)x.value=d.text;function sv(){appifactEmbed.save({text:x.value})}x.oninput=sv;document.getElementById('c').onclick=function(){x.value='';sv()};document.getElementById('d').onclick=function(){x.value+=(x.value?'\n':'')+new Date().toLocaleDateString();sv()};appifactEmbed.onLoad(function(v){if(v&&v.text!==undefined&&document.activeElement!==x)x.value=v.text});</script>
