<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,*{-webkit-tap-highlight-color:rgba(0,0,0,0)!important}:focus:not(:focus-visible){outline:none}</style><script src="../shim.js?v=16"></script>
<title>Stopwatch</title><style>body{box-sizing:border-box;height:100vh;overflow:auto}</style><div style="font-family:sans-serif;text-align:center;padding:16px;background:#1c1c1e;color:#f2f2f2;min-height:100%;box-sizing:border-box"><div id="t" style="font-size:64px;font-weight:700;margin:14px 0">00:00.0</div><div style="display:flex;gap:10px;justify-content:center"><button id="s" style="font-size:18px;padding:12px 20px;border-radius:12px;border:none;background:#D97757;color:#fff;cursor:pointer">Start</button><button id="l" style="font-size:18px;padding:12px 20px;border-radius:12px;border:1px solid #555;background:#2c2c2e;color:#f2f2f2;cursor:pointer">Lap</button><button id="r" style="font-size:18px;padding:12px 20px;border-radius:12px;border:1px solid #555;background:#2c2c2e;color:#f2f2f2;cursor:pointer">Reset</button></div><div id="h" style="font-size:13px;color:#aaa;margin-top:14px;line-height:1.5"></div></div><script>document.body.style.margin="0";document.body.style.background="#1c1c1e";var t=document.getElementById('t'),h=document.getElementById('h'),b=document.getElementById('s'),el=0,st=0,iv=null,laps=[];function f(ms){var s=ms/1000,m=Math.floor(s/60),x=(s%60).toFixed(1);return (m<10?'0':'')+m+':'+(x<10?'0':'')+x}function up(){t.textContent=f(el+(iv?Date.now()-st:0))}b.onclick=function(){if(iv){el+=Date.now()-st;clearInterval(iv);iv=null;b.textContent='Start'}else{st=Date.now();iv=setInterval(up,100);b.textContent='Stop'}};document.getElementById('l').onclick=function(){laps.unshift(f(el+(iv?Date.now()-st:0)));laps=laps.slice(0,4);h.textContent=laps.join('  |  ')};document.getElementById('r').onclick=function(){clearInterval(iv);iv=null;el=0;laps=[];h.textContent='';b.textContent='Start';up()};</script>
