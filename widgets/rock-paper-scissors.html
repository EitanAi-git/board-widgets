<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,*{-webkit-tap-highlight-color:rgba(0,0,0,0)!important}:focus:not(:focus-visible){outline:none}</style><script src="../shim.js?v=16"></script>
<title>Rock paper scissors</title><style>body{box-sizing:border-box;height:100vh;overflow:auto}</style><style>html,body{margin:0;background:#1c1c1e}body{font-family:sans-serif;color:#f2f2f2;padding:16px;box-sizing:border-box;min-height:100%}h3{margin:0 0 12px;font-size:16px}.b{font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid #555;background:#2c2c2e;color:#f2f2f2;cursor:pointer;margin-right:8px}.b.p{border:none;background:#D97757;color:#fff}body{text-align:center}h3{text-align:left}#r{font-size:16px;font-weight:700;color:#D97757;margin:16px 0;min-height:40px}.row{display:flex;gap:10px;margin-bottom:14px}.box{flex:1;background:#2c2c2e;border:1px solid #555;border-radius:12px;padding:10px}.n{font-size:26px;font-weight:700}.l{font-size:12px;color:#aaa}</style><h3>Rock paper scissors</h3><div><button class="b p" data-c="0">Rock</button><button class="b p" data-c="1">Paper</button><button class="b p" data-c="2">Scissors</button></div><div id="r"></div><div class="row"><div class="box"><div class="n" id="w"></div><div class="l">Wins</div></div><div class="box"><div class="n" id="l"></div><div class="l">Losses</div></div><div class="box"><div class="n" id="t"></div><div class="l">Ties</div></div></div><button class="b" id="rs">Reset</button><script>
var d=appifactEmbed.load()||{w:0,l:0,t:0,last:"Pick one"};
var N=["Rock","Paper","Scissors"];
function draw(){document.getElementById("r").textContent=d.last;document.getElementById("w").textContent=d.w;document.getElementById("l").textContent=d.l;document.getElementById("t").textContent=d.t}
document.querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){var p=+b.dataset.c,c=Math.floor(Math.random()*3),r=(p-c+3)%3;if(r==0){d.t++;d.last="Tie, both "+N[p]}else if(r==1){d.w++;d.last=N[p]+" beats "+N[c]+": you win"}else{d.l++;d.last=N[c]+" beats "+N[p]+": you lose"}appifactEmbed.save(d);draw()}});
document.getElementById("rs").onclick=function(){d={w:0,l:0,t:0,last:"Pick one"};appifactEmbed.save(d);draw()};
appifactEmbed.onLoad(function(v){if(v){d=v;draw()}});
draw();
</script>
