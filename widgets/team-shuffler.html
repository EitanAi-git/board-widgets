<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,*{-webkit-tap-highlight-color:rgba(0,0,0,0)!important}:focus:not(:focus-visible){outline:none}</style><script src="../shim.js?v=16"></script>
<title>Team shuffler</title><style>body{box-sizing:border-box;height:100vh;overflow:auto}</style><style>html,body{margin:0;background:#1c1c1e}body{font-family:sans-serif;color:#f2f2f2;padding:16px;box-sizing:border-box;min-height:100%}h3{margin:0 0 12px;font-size:16px}input,textarea{width:100%;box-sizing:border-box;font-size:14px;padding:8px;border-radius:8px;border:1px solid #555;background:#2c2c2e;color:#f2f2f2;margin-bottom:10px;font-family:sans-serif}.b{font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid #555;background:#2c2c2e;color:#f2f2f2;cursor:pointer;margin-right:8px}.b.p{border:none;background:#D97757;color:#fff}.t{background:#2c2c2e;border:1px solid #555;border-radius:12px;padding:8px 10px;margin-bottom:8px;font-size:14px}</style><h3>Team shuffler</h3><textarea id="nm" rows="2"></textarea><input id="n" type="number" min="2" max="6"><button class="b p" id="go">Shuffle</button><div id="o" style="margin-top:10px"></div><script>
var d=appifactEmbed.load()||{names:"Ann, Ben, Cara, Dev, Eli, Fay",n:2,out:[]};
var nm=document.getElementById("nm"),n=document.getElementById("n"),o=document.getElementById("o");
function draw(){nm.value=d.names;n.value=d.n;o.textContent="";d.out.forEach(function(t,i){var e=document.createElement("div");e.className="t";e.textContent="Team "+(i+1)+": "+t.join(", ");o.appendChild(e)})}
document.getElementById("go").onclick=function(){d.names=nm.value;d.n=Math.max(2,Math.min(6,+n.value||2));var a=d.names.split(",").map(function(s){return s.trim()}).filter(Boolean);for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}var out=[];for(var k=0;k<d.n;k++)out.push([]);a.forEach(function(v,i){out[i%d.n].push(v)});d.out=out;appifactEmbed.save(d);draw()};
appifactEmbed.onLoad(function(v){if(v){d=v;draw()}});
draw();
</script>
