<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="../shim.js"></script>
<title>Quick poll</title><style>body{box-sizing:border-box;height:100vh;overflow:auto}</style><style>html,body{margin:0;background:#1c1c1e}body{font-family:sans-serif;color:#f2f2f2;padding:16px;box-sizing:border-box;min-height:100%}#q{width:100%;box-sizing:border-box;font-size:16px;font-weight:700;padding:8px;margin-bottom:12px;border-radius:8px;border:1px solid #555;background:#2c2c2e;color:#f2f2f2}.o{position:relative;margin-bottom:10px;border:1px solid #555;border-radius:12px;overflow:hidden;cursor:pointer;height:42px;background:#2c2c2e}.bar{position:absolute;left:0;top:0;bottom:0;background:#D97757;opacity:.55}.t{position:relative;display:flex;justify-content:space-between;padding:12px 14px;font-size:15px}.b{font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid #555;background:#2c2c2e;color:#f2f2f2;cursor:pointer}</style><input id="q"><div id="l"></div><button class="b" id="rs">Reset votes</button><script>
var d=appifactEmbed.load()||{q:"Which option?",opts:[{t:"Option A",v:0},{t:"Option B",v:0},{t:"Option C",v:0}]};
var S=appifactEmbed.settings({options:""},function(s){S=s;applyOpts();});
function applyOpts(){var names=String(S.options||"").split(",").map(function(x){return x.trim()}).filter(Boolean).slice(0,8);if(!names.length)return;d.opts=names.map(function(n,i){var old=d.opts[i];return {t:n,v:old?old.v:0}});appifactEmbed.save(d);draw()}
var q=document.getElementById("q");
q.onchange=function(){d.q=q.value;appifactEmbed.save(d)};
function draw(){q.value=d.q;var tot=0;d.opts.forEach(function(o){tot+=o.v});var l=document.getElementById("l");l.textContent="";d.opts.forEach(function(o){var c=document.createElement("div");c.className="o";var b=document.createElement("div");b.className="bar";b.style.width=(tot?o.v/tot*100:0)+"%";var t=document.createElement("div");t.className="t";var a=document.createElement("span");a.textContent=o.t;var n=document.createElement("span");n.textContent=o.v;t.append(a,n);c.append(b,t);c.onclick=function(){o.v++;appifactEmbed.save(d);draw()};l.appendChild(c)})}
document.getElementById("rs").onclick=function(){d.opts.forEach(function(o){o.v=0});appifactEmbed.save(d);draw()};
appifactEmbed.onLoad(function(x){if(x){d=x;draw()}});
draw();applyOpts();
</script>
