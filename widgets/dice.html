<title>Dice roller</title><style>body{box-sizing:border-box;height:100vh;overflow:auto}</style><style>body{margin:0;background:#1c1c1e}.w{font-family:sans-serif;text-align:center;padding:16px;background:#1c1c1e;color:#f2f2f2;min-height:100%;box-sizing:border-box}#r{font-size:80px;font-weight:700;line-height:1.1;margin:8px 0 16px}#h{font-size:13px;color:#aaa;min-height:18px;margin-top:14px}button{font-size:18px;padding:10px 16px;margin:4px;border-radius:12px;border:1px solid #555;background:#2c2c2e;color:#f2f2f2;cursor:pointer}button.a{border:none;background:#D97757;color:#fff}</style><div class="w"><div id="r">?</div><div><button data-n="6" class="a">D6</button><button data-n="12">D12</button><button data-n="20">D20</button><button data-n="100">D100</button></div><div id="h"></div></div><script>var r=document.getElementById('r'),h=document.getElementById('h'),hist=[];document.querySelectorAll('[data-n]').forEach(function(b){b.onclick=function(){var v=1+Math.floor(Math.random()*(+b.dataset.n));r.textContent=v;hist.unshift('D'+b.dataset.n+': '+v);hist=hist.slice(0,4);h.textContent=hist.join('  |  ')}});</script>
