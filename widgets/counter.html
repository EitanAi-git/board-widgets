<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="../shim.js"></script>
<title>Counter</title><style>body{box-sizing:border-box;height:100vh;overflow:auto}</style><div style="font-family:sans-serif;text-align:center;padding:16px;background:#1c1c1e;color:#f2f2f2;min-height:100%;box-sizing:border-box"><div id="n" style="font-size:96px;font-weight:700;line-height:1.1">0</div><div style="display:flex;gap:12px;justify-content:center;margin-top:16px"><button id="m" style="font-size:32px;width:72px;height:56px;border-radius:12px;border:1px solid #555;background:#2c2c2e;color:#f2f2f2;cursor:pointer">−</button><button id="p" style="font-size:32px;width:72px;height:56px;border-radius:12px;border:none;background:#D97757;color:#fff;cursor:pointer">+</button></div><div style="display:flex;gap:12px;justify-content:center;margin-top:16px"><button id="r" style="font-size:16px;padding:8px 16px;border-radius:8px;border:1px solid #555;background:#2c2c2e;color:#f2f2f2;cursor:pointer">Reset</button><button id="s" style="font-size:16px;padding:8px 16px;border-radius:8px;border:1px solid #555;background:#2c2c2e;color:#f2f2f2;cursor:pointer">Sound: on</button></div></div><script>
document.body.style.margin="0";
document.body.style.background="#1c1c1e";
document.documentElement.style.background="#1c1c1e";
var c=0;
var on=true;
var ac=null;
var d=appifactEmbed.load();
if(d&&typeof d.count==="number")c=d.count;
// Physical button sound. Short noise bursts ring through small resonators
// (plastic snap, housing knock, low thump), like a real switch. Each press is
// slightly different. Press plays on finger down, a lighter click on release.
function getAC(){if(!ac){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;ac=new AC();}if(ac.state==="suspended")ac.resume();return ac;}
function ring(out,sr,f,tau,burstTau,gain){
  var n=out.length,r=Math.exp(-1/(tau*sr)),c=2*r*Math.cos(2*Math.PI*f/sr),y1=0,y2=0,tmp=new Float32Array(n),pk=1e-9;
  for(var i=0;i<n;i++){var x=(Math.random()*2-1)*Math.exp(-i/(burstTau*sr));var y=x+c*y1-r*r*y2;y2=y1;y1=y;tmp[i]=y;if(Math.abs(y)>pk)pk=Math.abs(y);}
  for(i=0;i<n;i++)out[i]+=tmp[i]/pk*gain;
}
function button(pitch,vol,release){
  if(!on)return;
  try{
    var a=getAC();if(!a)return;
    var sr=a.sampleRate,n=Math.floor(sr*0.07),buf=a.createBuffer(1,n,sr),d=buf.getChannelData(0);
    var j=function(){return 1+(Math.random()-0.5)*0.1};
    if(!release){
      ring(d,sr,3000*pitch*j(),0.0018,0.0006,0.55);
      ring(d,sr,1150*pitch*j(),0.006,0.001,0.35);
      ring(d,sr,190*pitch*j(),0.012,0.0015,0.45);
    }else{
      ring(d,sr,3900*pitch*j(),0.0012,0.0004,0.5);
      ring(d,sr,1500*pitch*j(),0.004,0.0007,0.2);
    }
    var pk=1e-9;for(var i=0;i<n;i++)if(Math.abs(d[i])>pk)pk=Math.abs(d[i]);
    var g=vol*(release?0.45:0.9)*(0.92+Math.random()*0.16)/pk;
    for(i=0;i<n;i++)d[i]*=g*Math.min(1,i/(sr*0.0003));
    var src=a.createBufferSource();src.buffer=buf;src.connect(a.destination);src.start();
  }catch(e){}
}
function wire(id,pitch,vol){
  var el=document.getElementById(id),down=false;
  el.addEventListener("pointerdown",function(){down=true;button(pitch,vol,false);});
  el.addEventListener("pointerup",function(){if(down)button(pitch,vol,true);down=false;});
  el.addEventListener("pointerleave",function(){down=false;});
  el.addEventListener("click",function(e){if(e.detail===0)button(pitch,vol,false);}); // keyboard
}
function show(){document.getElementById("n").textContent=c;}
function upd(v){c=v;show();appifactEmbed.save({count:c});}
document.getElementById("p").onclick=function(){upd(c+1);};
document.getElementById("m").onclick=function(){upd(c-1);};
document.getElementById("r").onclick=function(){upd(0);};
document.getElementById("s").onclick=function(){
  on=!on;
  this.textContent="Sound: "+(on?"on":"off");
};
wire("p",1.0,1);wire("m",0.9,1);wire("r",0.78,1);wire("s",1.15,0.6);
appifactEmbed.onLoad(function(x){if(x&&typeof x.count==="number"){c=x.count;show();}});
show();
</script>
