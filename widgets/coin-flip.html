<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="../shim.js"></script>
<title>Coin flip</title><style>body{box-sizing:border-box;height:100vh;overflow:auto}</style><style>html,body{margin:0;background:#1c1c1e}body{font-family:sans-serif;color:#f2f2f2;padding:16px;box-sizing:border-box;min-height:100%;text-align:center}h3{margin:0 0 12px;font-size:16px;text-align:left}#coin{width:120px;height:120px;border-radius:50%;background:#D97757;color:#fff;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;transition:transform .5s}.row{display:flex;gap:10px;margin-bottom:14px}.box{flex:1;background:#2c2c2e;border:1px solid #555;border-radius:12px;padding:10px}.n{font-size:28px;font-weight:700}.l{font-size:12px;color:#aaa}.b{font-size:14px;padding:8px 18px;border-radius:8px;border:1px solid #555;background:#2c2c2e;color:#f2f2f2;cursor:pointer;margin:0 4px}.b.p{border:none;background:#D97757;color:#fff}</style><h3>Coin flip</h3><div id="coin">?</div><div class="row"><div class="box"><div class="n" id="h">0</div><div class="l">Heads</div></div><div class="box"><div class="n" id="t">0</div><div class="l">Tails</div></div></div><button class="b p" id="go">Flip</button><button class="b" id="rs">Reset</button><script>
var d=appifactEmbed.load()||{h:0,t:0,last:"?"};
var rot=0;
function draw(){document.getElementById("coin").textContent=d.last;document.getElementById("h").textContent=d.h;document.getElementById("t").textContent=d.t}
function save(){appifactEmbed.save(d)}
document.getElementById("go").onclick=function(){var heads=Math.random()<0.5;if(heads)d.h++;else d.t++;d.last=heads?"Heads":"Tails";rot+=360;document.getElementById("coin").style.transform="rotateY("+rot+"deg)";save();draw()};
document.getElementById("rs").onclick=function(){d={h:0,t:0,last:"?"};save();draw()};
appifactEmbed.onLoad(function(v){if(v){d=v;draw()}});
draw();
</script>
