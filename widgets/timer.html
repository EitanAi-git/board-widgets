<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="../shim.js"></script><script src="../click.js"></script>
<title>Timer</title><style>body{box-sizing:border-box;height:100vh;overflow:auto}</style><div style="font-family:sans-serif;text-align:center;padding:16px;background:#1c1c1e;color:#f2f2f2;min-height:100%;box-sizing:border-box"><div style="font-size:14px">Minutes <input id="m" type="number" value="5" min="1" style="width:60px;font-size:16px;padding:4px;border-radius:8px;border:1px solid #555;background:#2c2c2e;color:#f2f2f2"></div><div id="t" style="font-size:72px;font-weight:700;line-height:1.1;margin:14px 0">05:00</div><div style="display:flex;gap:12px;justify-content:center"><button id="s" style="font-size:18px;padding:12px 20px;border-radius:12px;border:none;background:#D97757;color:#fff;cursor:pointer">Start</button><button id="p" style="font-size:18px;padding:12px 20px;border-radius:12px;border:1px solid #555;background:#2c2c2e;color:#f2f2f2;cursor:pointer">Pause</button><button id="r" style="font-size:18px;padding:12px 20px;border-radius:12px;border:1px solid #555;background:#2c2c2e;color:#f2f2f2;cursor:pointer">Reset</button></div><div style="display:flex;gap:10px;justify-content:center;margin-top:16px"><button data-m="1" style="font-size:16px;padding:8px 16px;border-radius:8px;border:1px solid #555;background:#2c2c2e;color:#f2f2f2;cursor:pointer">1</button><button data-m="5" style="font-size:16px;padding:8px 16px;border-radius:8px;border:1px solid #555;background:#2c2c2e;color:#f2f2f2;cursor:pointer">5</button><button data-m="10" style="font-size:16px;padding:8px 16px;border-radius:8px;border:1px solid #555;background:#2c2c2e;color:#f2f2f2;cursor:pointer">10</button><button data-m="25" style="font-size:16px;padding:8px 16px;border-radius:8px;border:1px solid #555;background:#2c2c2e;color:#f2f2f2;cursor:pointer">25</button></div></div><script>document.body.style.margin="0";document.body.style.background="#1c1c1e";var S=appifactEmbed.settings({alarm:"beep"},function(s){S=s});function tone(f,t0,dur,vol){var a=clickAudio();if(!a)return;var o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type="sine";g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+0.01);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+dur+0.05)}function alarm(){var a=clickAudio();if(!a||S.alarm==="none")return;var t=a.currentTime+0.05;for(var r=0;r<3;r++){var b=t+r*1.0;if(S.alarm==="beep"){for(var k=0;k<3;k++)tone(880,b+k*0.18,0.12,0.4)}else if(S.alarm==="bell"){tone(1320,b,0.9,0.35);tone(660,b,0.9,0.2)}else{for(var k=0;k<4;k++)playClick(1,1,b+k*0.12)}}}var left=300,iv=null,mi=document.getElementById('m'),t=document.getElementById('t');function show(){var a=Math.floor(left/60),b=left%60;t.textContent=(a<10?'0':'')+a+':'+(b<10?'0':'')+b}function set(v){left=v*60;show()}mi.oninput=function(){set(+mi.value||1)};document.getElementById('s').onclick=function(){clickAudio();if(iv)return;iv=setInterval(function(){if(left>0){left--;show()}else{clearInterval(iv);iv=null;t.textContent="Time's up!";alarm()}},1000)};document.getElementById('p').onclick=function(){clearInterval(iv);iv=null};document.getElementById('r').onclick=function(){clearInterval(iv);iv=null;set(+mi.value||1)};document.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){mi.value=b.dataset.m;set(+b.dataset.m)}});</script>
