<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="../shim.js"></script>
<title>Pomodoro</title><style>body{box-sizing:border-box;height:100vh;overflow:auto}</style><style>html,body{margin:0;background:#1c1c1e}body{font-family:sans-serif;color:#f2f2f2;padding:16px;box-sizing:border-box;min-height:100%}h3{margin:0 0 12px;font-size:16px}input,textarea{width:100%;box-sizing:border-box;font-size:14px;padding:8px;border-radius:8px;border:1px solid #555;background:#2c2c2e;color:#f2f2f2;margin-bottom:10px;font-family:sans-serif}.b{font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid #555;background:#2c2c2e;color:#f2f2f2;cursor:pointer;margin-right:8px}.b.p{border:none;background:#D97757;color:#fff}body{text-align:center}h3{text-align:left}#m{font-size:14px;color:#aaa;margin-bottom:6px}#t{font-size:64px;font-weight:700;margin:20px 0;color:#D97757}</style><h3>Pomodoro</h3><div id="m"></div><div id="t"></div><button class="b p" id="go">Start</button><button class="b" id="sw">Switch</button><button class="b" id="rs">Reset</button><script>
var d=appifactEmbed.load()||{mode:"Focus",left:1500,running:false,end:0};
var iv=null;
var S=appifactEmbed.settings({focus:25,brk:5},function(s){S=s;if(!d.running)setMode(d.mode)});
function len(m){return (m=="Focus"?+S.focus||25:+S.brk||5)*60}
function save(){appifactEmbed.save(d)}
function cur(){return d.running?Math.max(0,Math.round((d.end-Date.now())/1000)):d.left}
function draw(){var s=cur();document.getElementById("m").textContent=d.mode;document.getElementById("t").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");document.getElementById("go").textContent=d.running?"Pause":"Start"}
function tick(){if(d.running&&cur()<=0){d.running=false;d.left=0;save()}draw()}
function setMode(m){d.mode=m;d.left=len(m);d.running=false;save();draw()}
document.getElementById("go").onclick=function(){if(d.running){d.left=cur();d.running=false}else{if(d.left<=0)d.left=len(d.mode);d.end=Date.now()+d.left*1000;d.running=true}save();draw()};
document.getElementById("sw").onclick=function(){setMode(d.mode=="Focus"?"Break":"Focus")};
document.getElementById("rs").onclick=function(){setMode(d.mode)};
appifactEmbed.onLoad(function(v){if(v){d=v;draw()}});
setInterval(tick,500);draw();
</script>
